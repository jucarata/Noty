name: noty
description: "A simple Flutter app"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.1

dependencies:
  connectivity_plus: ^7.0.0
  device_info_plus: ^13.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^19.4.1
  flutter_secure_storage: ^10.0.0
  flutter_timezone: ^4.1.1
  google_fonts: ^6.2.1
  mobile_scanner: ^7.4.0
  permission_handler: ^12.0.1
  qr_flutter: ^4.1.0
  shared_preferences: ^2.5.3
  supabase_flutter: ^2.17.2
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/branding/noty_app_icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/branding/noty_app_icon.png"
  adaptive_icon_foreground_inset: 0
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"
  web:
    generate: true
    image_path: "assets/images/branding/noty_app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#1E3A8A"
  windows:
    generate: true
    image_path: "assets/images/branding/noty_app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/images/branding/noty_app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/branding/
